# 의존성 버전 단일 출처. 조합 근거는 docs/adr/002-빌드-툴체인-버전조합.md 참조.

[versions]
spring-boot = "3.5.16"
spring-ai = "1.1.8"
ojdbc = "23.26.3.0.0"
junit = "6.1.2"
assertj = "3.27.7"
archunit = "1.4.2"
spotless = "8.9.0"
palantir-java-format = "2.96.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# 버전 없는 항목은 위 BOM 이 관리한다.
spring-context = { module = "org.springframework:spring-context" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

liquibase-core = { module = "org.liquibase:liquibase-core" }

ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "ojdbc" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
