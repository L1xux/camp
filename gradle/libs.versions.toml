# 의존성 버전 단일 출처. 조합 근거는 docs/adr/002-빌드-툴체인-버전조합.md 참조.

[versions]
spring-boot = "3.5.16"
spring-ai = "1.1.8"
ojdbc = "23.26.3.0.0"
junit = "5.14.4"
assertj = "3.27.7"
archunit = "1.4.2"
sentry = "8.52.0"
spotless = "8.9.0"
palantir-java-format = "2.96.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# 버전 없는 항목은 위 BOM 이 관리한다.
spring-boot = { module = "org.springframework.boot:spring-boot" }
spring-context = { module = "org.springframework:spring-context" }
spring-web = { module = "org.springframework:spring-web" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

slf4j-api = { module = "org.slf4j:slf4j-api" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
micrometer-context-propagation = { module = "io.micrometer:context-propagation" }

# LLM 트레이싱. Micrometer Observation 을 OTel span 으로 바꿔 OTLP 로 내보낸다.
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
# ChatModel 관측 규약. 실제 모델 구현체는 아직 없고 계측 계약만 쓴다.
spring-ai-model = { module = "org.springframework.ai:spring-ai-model" }

# 트레이싱 테스트용. span 을 메모리에 모아 검증한다.
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
spring-ai-vector-store = { module = "org.springframework.ai:spring-ai-vector-store" }

liquibase-core = { module = "org.liquibase:liquibase-core" }

sentry-spring-boot-starter-jakarta = { module = "io.sentry:sentry-spring-boot-starter-jakarta", version.ref = "sentry" }

ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "ojdbc" }

# 통합 테스트용 Oracle. 버전은 Spring Boot BOM 이 관리한다.
testcontainers-oracle-free = { module = "org.testcontainers:oracle-free" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
