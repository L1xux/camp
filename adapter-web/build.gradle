plugins {
    // 단일 배포 산출물(bootJar)을 만드는 유일한 모듈.
    alias(libs.plugins.spring.boot)
}

dependencies {
    implementation project(':application')
    implementation project(':domain')

    implementation platform(libs.spring.boot.dependencies)
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.actuator
    // 구조화 로그 포맷터가 쓰는 타입. starter 로 딸려오지만 직접 참조하므로 명시한다.
    implementation libs.spring.boot
    implementation libs.logback.classic
    // 스레드를 넘길 때 MDC 를 전파한다. spring-core 의 ContextPropagatingTaskDecorator 가 이것을 쓴다.
    implementation libs.micrometer.context.propagation
    // 미처리 예외를 Sentry 로 보낸다. DSN 이 없으면 수집만 꺼진다.
    implementation libs.sentry.spring.boot.starter.jakarta
    // LLM 트레이싱. 키가 없으면 내보내기만 꺼진다.
    implementation platform(libs.spring.ai.bom)
    implementation libs.spring.ai.model
    implementation libs.micrometer.tracing.bridge.otel
    implementation libs.opentelemetry.exporter.otlp

    // 런타임 조립. 컴파일 타임에 보이지 않으므로 구현체를 직접 참조할 수 없다.
    // testRuntimeClasspath 에도 포함되므로 ArchitectureTest 가 이 세 모듈까지 스캔한다.
    runtimeOnly project(':infra')
    runtimeOnly project(':adapter-mcp')
    runtimeOnly project(':adapter-batch')

    testImplementation libs.archunit.junit5
    testImplementation libs.spring.boot.starter.test
    // span 검증용 인메모리 수집기와 retrieval 관측 규약.
    testImplementation libs.opentelemetry.sdk.testing
    testImplementation libs.spring.ai.vector.store
    // 통합 테스트가 띄우는 Oracle. 도커가 없으면 해당 테스트만 스킵된다.
    testImplementation libs.testcontainers.oracle.free
    testImplementation libs.testcontainers.junit.jupiter
    // 저장소 통합 테스트가 DataAccessException 계층을 단언한다. 구현체는 여전히 runtimeOnly 다.
    testImplementation libs.spring.tx
}

// 기본값은 이 모듈 디렉터리다. 레포 루트의 .env 를 읽어야 하므로 루트로 맞춘다.
tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}
