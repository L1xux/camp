plugins {
    // 단일 배포 산출물(bootJar)을 만드는 유일한 모듈.
    alias(libs.plugins.spring.boot)
}

dependencies {
    implementation project(':application')
    implementation project(':domain')

    implementation platform(libs.spring.boot.dependencies)
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.actuator

    // 런타임 조립. 컴파일 타임에 보이지 않으므로 구현체를 직접 참조할 수 없다.
    runtimeOnly project(':infra')
    runtimeOnly project(':adapter-mcp')
    runtimeOnly project(':adapter-batch')

    // 아키텍처 테스트가 전 모듈 클래스를 스캔해야 하므로 테스트 클래스패스에만 올린다.
    testImplementation project(':infra')
    testImplementation project(':adapter-mcp')
    testImplementation project(':adapter-batch')
    testImplementation libs.archunit.junit5
    testImplementation libs.spring.boot.starter.test
}
