server:
  port: 8280
  # 바인딩 주소를 명시한다. 기본값(IPv6 와일드카드)에 의존하면 이 PC 에서 기동이 실패한다.
  address: 0.0.0.0

spring:
  application:
    name: camp
  # docker-compose 와 같은 .env 를 읽는다. 시크릿을 이 파일에 적지 않기 위한 것.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:oracle:thin:@//127.0.0.1:1522/FREEPDB1
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 타임아웃이 없으면 DB 가 죽었을 때 헬스 엔드포인트가 응답하지 않고 멈춘다.
      connection-timeout: 5000
      validation-timeout: 3000
      data-source-properties:
        oracle.net.CONNECT_TIMEOUT: 5000
        oracle.jdbc.ReadTimeout: 10000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # DB 연결 상태를 항목별로 보기 위해 켠다. 공개 배포 시에는 재검토한다.
      show-details: always
