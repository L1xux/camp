server:
  port: 8280
  # 바인딩 주소를 명시한다. 기본값(IPv6 와일드카드)에 의존하면 이 PC 에서 기동이 실패한다.
  address: 0.0.0.0

logging:
  structured:
    format:
      # 전 모듈의 로그가 이 포맷터를 거쳐 JSON 한 줄로 나간다.
      console: com.camp.adapter.web.observability.CampJsonLogFormatter

spring:
  application:
    name: camp
  threads:
    # 요청 처리를 가상 스레드에 맡긴다. MDC 는 ThreadLocal 이라 요청 1건이 한 스레드에서 끝나면 그대로 유지된다.
    virtual:
      enabled: true
  # docker-compose 와 같은 .env 를 읽는다. 시크릿을 이 파일에 적지 않기 위한 것.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:oracle:thin:@//127.0.0.1:1522/FREEPDB1
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 타임아웃이 없으면 DB 가 죽었을 때 헬스 엔드포인트가 응답하지 않고 멈춘다.
      connection-timeout: 5000
      validation-timeout: 3000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

camp:
  llm:
    # 일일 LLM 비용 상한. 도달하면 AI 질의만 막고 운영 API 는 그대로 둔다.
    daily-cost-cap-usd: 2

sentry:
  # 비어 있으면 이벤트를 보내지 않는다. DSN 발급 전에도 기동은 정상이어야 한다.
  dsn: ${SENTRY_DSN:}
  # 전 모듈의 스택 프레임을 in-app 으로 표시해 같은 예외가 한 그룹으로 묶이게 한다.
  in-app-includes: com.camp
  # 요청의 IP 와 쿠키를 이벤트에 싣지 않는다. 로그 마스킹과 같은 개인정보 규칙이다.
  send-default-pii: false

management:
  tracing:
    sampling:
      # 기본값 0.1 은 요청 열에 아홉을 버린다. 트래픽이 작으니 전수 수집한다.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # DB 연결 상태를 항목별로 보기 위해 켠다. 공개 배포 시에는 재검토한다.
      show-details: always
